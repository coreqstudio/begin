<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - CoreQ Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="left-panel">
            <div class="overlay"></div>
            <div class="welcome-text">
                <h1>CoreQ Studio</h1>
                <p>Hệ thống quản lý nội bộ</p>
            </div>
        </div>
        <div class="right-panel">
            <form id="loginForm" class="login-form">
                <h2>Đăng nhập</h2>
                <div class="input-group">
                    <label for="email">Email đăng nhập</label>
                    <input type="email" id="email" placeholder="user@coreq.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login">Đăng nhập</button>
                <p id="message" class="message"></p>
            </form>
        </div>
    </div>

    <!-- Firebase Compat CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <!-- Script chung -->
    <script src="script.js"></script>
    <script>
        // Xử lý form login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');

            if (!email.endsWith('@coreq.com')) {
                messageEl.textContent = 'Email phải có đuôi @coreq.com';
                messageEl.style.color = 'red';
                return;
            }

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                messageEl.textContent = 'Đăng Nhập Thành Công';
                messageEl.style.color = 'green';
                // Việc chuyển hướng sẽ do onAuthStateChanged trong script.js đảm nhiệm
                await redirectUserByRole(userCredential.user.uid);
            } catch (error) {
                console.error('Login failed:', error);
                messageEl.textContent = 'Sai email hoặc mật khẩu';
                messageEl.style.color = 'red';
            }
        });
    </script>
</body>
</html>
