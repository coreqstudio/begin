<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CoreQ Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Bên trái 2/3 ảnh nền -->
        <div class="left-panel" id="leftPanel">
            <!-- Ảnh nền sẽ được load động từ Storage sau này -->
            <div class="overlay"></div>
            <div class="welcome-text">
                <h1>CoreQ Studio</h1>
                <p>Hệ thống quản lý nội bộ</p>
            </div>
        </div>

        <!-- Bên phải 1/3 form login -->
        <div class="right-panel">
            <form id="loginForm" class="login-form">
                <h2>Đăng nhập</h2>
                <div class="input-group">
                    <label for="email">Email đăng nhập</label>
                    <input type="email" id="email" name="email" placeholder="user@coreq.vn" required>
                </div>
                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login">Đăng nhập</button>
                <p id="message" class="message"></p>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
