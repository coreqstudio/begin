<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang quản trị - CoreQ Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-container">
        <nav>
            <h2>Admin Dashboard</h2>
            <button id="logoutBtn" class="btn-logout">Đăng xuất</button>
        </nav>

        <!-- Nội dung chỉ hiển thị cho admin -->
        <div id="adminContent">
            <main>
                <h3>Danh sách nhân viên</h3>
                <div id="userList" class="user-list">
                    <!-- Danh sách user sẽ load từ Firestore -->
                </div>
                <hr>
                <h3>Thêm nhân viên mới</h3>
                <form id="addUserForm">
                    <input type="text" id="newName" placeholder="Tên nhân viên" required>
                    <input type="email" id="newEmail" placeholder="Email (vd: user@coreq.com)" required>
                    <input type="password" id="newPassword" placeholder="Mật khẩu tạm" required>
                    <select id="newRole">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                    <button type="submit" class="btn-primary">Tạo user</button>
                </form>
            </main>
        </div>

        <!-- Thông báo không có quyền -->
        <div id="noAccess" style="display: none;">
            <p>Bạn không có quyền truy cập trang admin.</p>
        </div>
    </div>

    <!-- Firebase Compat CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
    <script>
        // Không gọi loadAdminPage() ở đây, sẽ được xử lý trong onAuthStateChanged
        setupLogout();
        setupAddUser();
    </script>
</body>
</html>
