<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang nhân viên - CoreQ Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="user-container">
        <nav>
            <h2>User Dashboard</h2>
            <button id="logoutBtn" class="btn-logout">Đăng xuất</button>
        </nav>

        <!-- Nội dung chỉ hiển thị cho user -->
        <div id="userContent">
            <main>
                <h3>Chào mừng <span id="userName"></span>!</h3>
                <p>Bạn có quyền user, chỉ được xem dữ liệu.</p>
                <!-- Các nội dung khác dành cho user -->
            </main>
        </div>

        <!-- Thông báo không có quyền -->
        <div id="noAccess" style="display: none;">
            <p>Bạn không có quyền truy cập trang user.</p>
        </div>
    </div>

    <!-- Firebase Compat CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
    <script>
        // Không gọi loadUserPage() ở đây, sẽ được xử lý trong onAuthStateChanged
        setupLogout();
    </script>
</body>
</html>
